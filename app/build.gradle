plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.ajib.bolanazorat'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.ajib.bolanazorat'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            storeFile file('nazorat.jks')
            storePassword 'nazorat123'
            keyAlias 'nazorat'
            keyPassword 'nazorat123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
